spring:
  application:
    name: lapstore
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/LAPTOP
    username: laptop_admin
    password: ${DB_PASSWORD:123456}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true

server:
  port: 8080

app:
  hold:
    counter:
      minutes: 10
    online:
      minutes: 30