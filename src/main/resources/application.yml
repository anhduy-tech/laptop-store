spring:
  application:
    name: lapstore
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/LAPTOP
    username: laptop_admin
    password: ${DB_PASSWORD:123456}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

app:
  ports: 8080,8081,8082,8083,8084
  hold:
    counter:
      minutes: 10
    online:
      minutes: 30