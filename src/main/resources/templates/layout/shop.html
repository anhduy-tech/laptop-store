<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <title th:replace="${title}">Lapstore</title>
</head>
<body class="flex min-h-screen flex-col">
<header class="sticky top-0 z-30 border-b border-brand-100 bg-white/90 shadow-sm backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
    <a th:href="@{/shop}" class="flex items-center gap-2 text-lg font-bold tracking-tight text-slate-900">
      <span class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow-md shadow-brand-600/30"><svg th:replace="~{fragments/ui :: icon('laptop','size-5')}"></svg></span>
      Lap<span class="text-brand-600">store</span>
    </a>
    <nav class="flex items-center gap-1 text-sm font-medium text-slate-600">
      <a th:href="@{/shop}" class="rounded-lg px-3 py-2 hover:bg-brand-50 hover:text-brand-700">Máy tính</a>
      <a th:href="@{/shop/orders/lookup}" class="rounded-lg px-3 py-2 hover:bg-brand-50 hover:text-brand-700">Tra cứu đơn</a>
      <a th:href="@{/shop/returns}" class="hidden rounded-lg px-3 py-2 hover:bg-brand-50 hover:text-brand-700 sm:block">Đổi trả</a>
      <a th:href="@{/shop/cart}" class="relative ml-1 inline-flex items-center gap-2 rounded-lg bg-brand-900 px-3 py-2 text-white hover:bg-brand-800">
        <svg th:replace="~{fragments/ui :: icon('cart','size-5')}"></svg><span>Giỏ</span>
        <span th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}"
              class="grid min-w-5 place-items-center rounded-full bg-brand-500 px-1 text-xs font-bold">0</span>
      </a>
    </nav>
  </div>
</header>

<main class="flex-1">
  <div class="mx-auto max-w-6xl px-4 py-8">
    <div th:replace="~{fragments/alerts :: flash}"></div>
    <th:block th:insert="${content}"></th:block>
  </div>
</main>

<footer class="bg-brand-950">
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-brand-100/70 sm:flex-row">
    <p>© 2026 Lapstore — Laptop chính hãng, bảo hành tận nơi.</p>
    <p>Hotline: 1900 0000 · 08:00–21:00 mỗi ngày</p>
  </div>
</footer>
<script th:src="@{/js/app.js}" defer="defer"></script>
</body>
</html>
