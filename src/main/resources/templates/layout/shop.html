<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
  <script>try { var savedTheme = document.cookie.match(/(?:^|; )lap_theme=(dark|light)(?:;|$)/); document.documentElement.dataset.theme = savedTheme ? savedTheme[1] : (localStorage.getItem('lap_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <title th:replace="${title}">Lapstore</title>
</head>
<body class="flex min-h-screen flex-col">
<header class="shop-header">
  <div class="shop-header-inner">
    <a th:href="@{/shop}" class="shop-brand" aria-label="Lapstore - Trang chủ">
      <span class="grid size-9 place-items-center rounded-lg bg-brand-600 text-white"><svg th:replace="~{fragments/ui :: icon('laptop','size-5')}"></svg></span>
      <span>Lap<span class="text-brand-600">store</span></span>
    </a>
    <nav class="shop-nav" aria-label="Điều hướng chính">
      <a th:href="@{/shop}" class="shop-nav-link">Laptop</a>
      <a th:href="@{/shop/orders/lookup}" class="shop-nav-link">Tra cứu đơn</a>
      <a th:href="@{/shop/returns}" class="shop-nav-link hidden sm:inline-flex">Đổi trả</a>
      <a th:href="@{/shop/cart}" class="shop-cart">
        <svg th:replace="~{fragments/ui :: icon('cart','size-5')}"></svg><span>Giỏ</span>
        <span th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}"
              class="grid min-w-5 place-items-center rounded-full bg-white px-1 text-xs font-bold text-slate-900">0</span>
      </a>
      <button type="button" class="theme-toggle" data-act="toggleTheme" aria-label="Chuyển sáng / tối" title="Chuyển sáng / tối">
        <svg th:replace="~{fragments/ui :: icon('moon','size-5')}"></svg>
      </button>
    </nav>
  </div>
</header>

<main class="flex-1">
  <div class="mx-auto w-full max-w-[1600px] px-4 py-6 lg:px-6 lg:py-8">
    <div th:replace="~{fragments/alerts :: flash}"></div>
    <th:block th:insert="${content}"></th:block>
  </div>
</main>

<footer class="border-t border-slate-200 bg-white">
  <div class="mx-auto flex w-full max-w-[1600px] flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-slate-500 lg:px-6 sm:flex-row">
    <p>© 2026 Lapstore — Laptop chính hãng, bảo hành tận nơi.</p>
    <p><span class="font-medium text-slate-700">Hotline:</span> 1900 0000 · 08:00–21:00 mỗi ngày</p>
  </div>
</footer>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
  <form method="dialog" class="confirm-dialog-body">
    <span class="confirm-icon"><svg th:replace="~{fragments/ui :: icon('alert','size-5')}"></svg></span>
    <h2 id="confirmTitle">Xác nhận thao tác</h2>
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button value="cancel" class="btn-secondary">Hủy</button>
      <button value="confirm" class="btn-primary">Tiếp tục</button>
    </div>
  </form>
</dialog>
<script th:src="@{/js/app.js}" defer="defer"></script>
</body>
</html>
