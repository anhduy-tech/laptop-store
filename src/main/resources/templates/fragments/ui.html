<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

  <path th:case="'cart'" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
  <path th:case="'search'" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
  <path th:case="'check'" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
  <path th:case="'alert'" d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
  <path th:case="'chat'" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
  <path th:case="'users'" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
  <path th:case="'box'" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
  <path th:case="'cash'" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
  <path th:case="'logout'" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
  <path th:case="'chart'" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
  <path th:case="'tag'" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
  <path th:case="'calendar'" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
  <path th:case="'swap'" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
  <path th:case="'trash'" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
  <path th:case="'send'" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
  <path th:case="'lock'" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
  <path th:case="'list'" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
  <path th:case="'grid'" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>

  <path th:case="'back'" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
</svg>

<!-- Giá tiền: <span th:replace="~{fragments/ui :: money(${p.price})}"></span> -->
<span th:fragment="money(v)" class="whitespace-nowrap tabular-nums"
      th:text="${v != null ? #numbers.formatDecimal(v, 1, 'POINT', 0, 'COMMA') + ' ₫' : '—'}">0 ₫</span>

<!-- Badge trạng thái -->
<span th:fragment="badge(s)" class="badge"
      th:classappend="${s == 'COMPLETED' or s == 'APPROVED' or s == 'ACTIVE' or s == 'OPEN' or s == 'CONFIRMED' or s == 'PAID' or s == 'IN_STOCK'} ? 'badge-green'
                      : (${s == 'CANCELLED' or s == 'REJECTED' or s == 'CLOSED' or s == 'INACTIVE' or s == 'DEFECTIVE'} ? 'badge-red'
                      : (${s == 'PENDING' or s == 'NEW' or s == 'DRAFT' or s == 'WAITING' or s == 'IN_TRANSIT' or s == 'WARRANTY'} ? 'badge-amber'
                      : (${s == 'HUMAN' or s == 'AI'} ? 'badge-blue' : '')))"
      th:text="${s}">STATUS</span>

<!-- Empty state -->
<div th:fragment="empty(msg)" class="empty">
  <svg th:replace="~{fragments/ui :: icon('box','size-5')}"></svg>
  <p class="text-sm font-medium" th:text="${msg}">Chưa có dữ liệu</p>
</div>

<!-- Ô nhập có nhãn + lỗi: field(label, name, value, error, type, required) -->
<div th:fragment="field(label, name, value, error, type, required)">
  <label class="label" th:for="${name}">
    <span th:text="${label}">Nhãn</span><span th:if="${required}" class="text-red-500"> *</span>
  </label>
  <input class="input-field" th:classappend="${error} ? 'input-error'" th:id="${name}"
         th:attr="name=${name},type=${type}" th:value="${value}" th:required="${required}"/>
  <p th:if="${error}" class="field-error" th:text="${error}">Lỗi</p>
</div>

<!-- Phân trang Page<?>: pager(page, base) — base kết thúc bằng ? hoặc & -->
<nav th:fragment="pager(page, base)" th:if="${page.totalPages > 1}" class="mt-8 flex flex-wrap justify-center gap-1" aria-label="Phân trang">
  <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
     th:href="${base + 'page=' + i}" th:text="${i + 1}"
     class="inline-flex size-9 items-center justify-center rounded-lg text-sm font-medium"
     th:classappend="${i == page.number} ? 'bg-brand-600 text-white shadow-sm' : 'border border-slate-300 bg-white text-slate-600 hover:bg-slate-50'">1</a>
</nav>

</body>
</html>
