<html th:replace="~{layout/shop :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${product.name} + ' – Lapstore'">Chi tiết</title></head>
<body>
<section>
  <a th:href="@{/shop}" class="mb-5 inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-brand-700"><svg th:replace="~{fragments/ui :: icon('back','size-4')}"></svg>Danh sách laptop</a>
  <div class="grid gap-6 md:grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)] md:gap-7">
    <div class="grid aspect-[5/3] place-items-center overflow-hidden border border-slate-200 bg-slate-50">
      <img th:if="${product.thumbnail}" th:src="${product.thumbnail}" th:alt="${product.name}" class="size-full object-contain p-5"/>
      <span th:unless="${product.thumbnail}" class="grid size-20 place-items-center bg-white text-slate-300"><svg th:replace="~{fragments/ui :: icon('laptop','!size-10')}"></svg></span>
    </div>
    <div>
      <span class="text-xs font-semibold uppercase tracking-[0.14em] text-brand-700" th:text="${product.brand}">ASUS</span>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-900" th:text="${product.name}">Tên sản phẩm</h1>
      <p class="mt-3 leading-7 text-slate-600" th:text="${product.description}">Mô tả…</p>

      <form class="mt-5 space-y-4 border border-slate-200 bg-white p-4" th:action="@{/shop/cart/items}" method="post" th:if="${hasAvailableVariant}">
        <div>
          <label class="label" for="variantId">Cấu hình</label>
          <select class="input-field" id="variantId" name="variantId">
            <option th:each="v : ${variants}" th:value="${v.id}" th:data-price="${v.currentPrice}"
                    th:disabled="${!v.available}" th:text="${v.variantName + (v.available ? '' : ' · Hết hàng')}">i7 / 16GB / 512GB</option>
          </select>
        </div>
        <p class="text-2xl font-bold tabular-nums text-slate-900" id="variantPrice">—</p>
        <div class="flex items-end gap-3">
          <div class="w-28"><label class="label" for="quantity">Số lượng</label>
            <input class="input-field" id="quantity" name="quantity" type="number" min="1" max="10" value="1"/></div>
          <button class="btn-primary btn-lg flex-1" type="submit"><svg th:replace="~{fragments/ui :: icon('cart','size-5')}"></svg>Thêm vào giỏ</button>
        </div>
      </form>
      <p th:if="${!variants.isEmpty() and !hasAvailableVariant}" class="mt-5 border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">Sản phẩm hiện tạm hết hàng.</p>
      <th:block th:if="${variants.isEmpty()}"><div class="mt-5" th:replace="~{fragments/ui :: empty('Sản phẩm tạm hết hàng')}"></div></th:block>

      <ul class="mt-5 grid grid-cols-1 gap-2 border-t border-slate-200 pt-4 text-xs text-slate-600 sm:grid-cols-3">
        <li>Chính hãng 100%</li><li>Bảo hành tận nơi</li><li>Đổi trả 7 ngày</li>
      </ul>
    </div>
  </div>
</section>
</body>
</html>
