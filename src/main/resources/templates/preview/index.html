<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <title>Preview 26 màn hình – Lapstore</title>
</head>
<body>
<div class="mx-auto max-w-6xl px-4 py-10">
  <h1 class="page-title">Preview 26 màn hình Lapstore</h1>
  <p class="page-sub mb-8">Dữ liệu giả (profile <code>ui</code>). Thêm <code>?empty=1</code> vào URL để xem trạng thái rỗng.</p>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <a th:each="s : ${screens}" th:href="@{/shop/_ui/{slug}(slug=${s.slug})}" class="card card-hover flex items-center gap-3 !p-4">
      <span class="badge badge-blue font-mono" th:text="${s.code}">SH-01</span>
      <span class="flex-1 font-medium" th:text="${s.name}">Tên màn</span>
      <span class="text-xs text-slate-400" th:text="${s.group}">Shop</span>
    </a>
  </div>
</div>
</body>
</html>
