<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script>try { var savedTheme = document.cookie.match(/(?:^|; )lap_theme=(dark|light)(?:;|$)/); document.documentElement.dataset.theme = savedTheme ? savedTheme[1] : (localStorage.getItem('lap_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <title>Preview 26 màn hình – Lapstore</title>
</head>
<body class="min-h-screen">
<main class="mx-auto w-full max-w-[1600px] px-4 py-8 lg:px-6 lg:py-12">
  <div class="mb-8 border-b border-slate-200 pb-6">
    <div class="mb-5 flex justify-end"><button type="button" class="theme-toggle" data-act="toggleTheme" aria-label="Chuyển sáng / tối" title="Chuyển sáng / tối"><svg th:replace="~{fragments/ui :: icon('moon','size-5')}"></svg></button></div>
    <p class="text-xs font-semibold uppercase tracking-[0.14em] text-brand-700">Lapstore · UI preview</p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-900">Thư viện màn hình</h1>
    <p class="page-sub">Dữ liệu giả từ profile <code>ui</code>. Thêm <code>?empty=1</code> vào URL để xem trạng thái rỗng.</p>
  </div>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <a th:each="s : ${screens}" th:href="@{/shop/_ui/{slug}(slug=${s.slug})}" class="card card-hover flex items-center gap-3 !p-4">
      <span class="badge badge-blue font-mono" th:text="${s.code}">SH-01</span>
      <span class="flex-1 font-medium" th:text="${s.name}">Tên màn</span>
      <span class="text-xs text-slate-400" th:text="${s.group}">Shop</span>
    </a>
  </div>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script th:src="@{/js/app.js}" defer="defer"></script>
</body>
</html>
