<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Nhân viên đăng nhập | Laptop Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <main class="grid min-h-screen place-items-center bg-[radial-gradient(ellipse_at_12%_10%,#dbeafe,transparent_34%),radial-gradient(ellipse_at_92%_88%,#e0e7ff,transparent_30%),#f5f7fb] px-5 py-8">
        <section class="w-full max-w-[420px] rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl shadow-slate-900/10 sm:p-10" aria-labelledby="login-title">
            <div class="grid size-11 place-items-center rounded-xl bg-blue-600 text-xl font-bold text-white" aria-hidden="true">L</div>
            <p class="mb-2 mt-7 text-[11px] font-bold tracking-[0.13em] text-blue-600">LAPTOP STORE · NHÂN VIÊN</p>
            <h1 id="login-title" class="text-3xl font-bold tracking-tight">Chào mừng trở lại</h1>
            <p class="mb-6 mt-2 text-sm text-slate-500">Đăng nhập để tiếp tục làm việc.</p>

            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-700" role="alert" th:if="${param.error}">
                Tên đăng nhập hoặc mật khẩu không chính xác.
            </div>
            <div class="mb-4 rounded-lg border border-green-200 bg-green-50 px-3 py-2.5 text-sm text-green-700" role="status" th:if="${param.logout}">
                Bạn đã đăng xuất thành công.
            </div>

            <form class="grid gap-2" method="post" th:action="@{/staff/login}">
                <label class="mt-2 text-[13px] font-semibold" for="username">Tên đăng nhập</label>
                <input class="h-12 w-full rounded-lg border border-slate-300 px-3.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100" id="username" name="username" type="text" autocomplete="username"
                    placeholder="Nhập tên đăng nhập" required autofocus />

                <label class="mt-2 text-[13px] font-semibold" for="password">Mật khẩu</label>
                <input class="h-12 w-full rounded-lg border border-slate-300 px-3.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100" id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Nhập mật khẩu" required />

                <button class="mt-4 flex min-h-12 items-center justify-center gap-2 rounded-lg bg-blue-600 text-sm font-bold text-white transition hover:-translate-y-px hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500" type="submit">Đăng nhập <span aria-hidden="true">→</span></button>
            </form>

            <p class="mt-6 text-center text-xs text-slate-400">Cần hỗ trợ? Vui lòng liên hệ quản trị viên.</p>
        </section>
    </main>
</body>

</html>
