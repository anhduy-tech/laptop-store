<html th:replace="~{layout/staff :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Chuyển kho – Lapstore</title></head>
<body><section class="max-w-3xl">
<div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Chuyển kho</h1><p class="page-sub">Chuyển máy giữa các chi nhánh.</p></div><a th:href="@{/staff/warehouse}" class="btn-ghost btn-sm">← Menu kho</a></div>
  <form th:action="@{/staff/warehouse/transfers}" method="post" class="card space-y-4">
    <div class="grid gap-4 sm:grid-cols-2">
      <div><label class="label" for="fromBranchId">Chi nhánh nguồn *</label><select class="input-field" id="fromBranchId" name="fromBranchId"><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}">CN</option></select></div>
      <div><label class="label" for="toBranchId">Chi nhánh đích *</label><select class="input-field" id="toBranchId" name="toBranchId"><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}">CN</option></select></div>
    </div>
    <div><label class="label" for="serials">Danh sách serial *</label>
      <textarea class="input-field font-mono text-sm" id="serials" name="serials" rows="8" required="required" placeholder="Mỗi dòng một serial&#10;SN001&#10;SN002"></textarea></div>
    <div class="flex justify-end"><button class="btn-primary" type="submit">Chuyển kho</button></div>
  </form>
</section></body></html>
