<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
  <meta name="robots" content="noindex,nofollow"/>
  <script>try { var savedTheme = document.cookie.match(/(?:^|; )lap_theme=(dark|light)(?:;|$)/); document.documentElement.dataset.theme = savedTheme ? savedTheme[1] : (localStorage.getItem('lap_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>if (window.top !== window.self) { window.top.location.href = window.location.href; }</script>
  <title>Đăng nhập quản trị – Lapstore</title>
</head>
<body class="auth-page">
<button type="button" class="theme-toggle auth-theme-toggle" data-act="toggleTheme" aria-label="Chuyển sáng / tối" title="Chuyển sáng / tối">
  <svg th:replace="~{fragments/ui :: icon('moon','size-5')}"></svg>
</button>
<main class="auth-main">
<div class="w-full max-w-md">
  <div class="mb-6 text-center">
    <span class="auth-brand-mark mx-auto"><svg th:replace="~{fragments/ui :: icon('shield','size-5')}"></svg></span>
    <p class="mt-5 text-sm font-semibold text-brand-700">LAPSTORE · QUẢN TRỊ</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">Đăng nhập quản trị</h1>
    <p class="mt-1 text-sm text-slate-500">Khu vực dành riêng cho quản trị viên.</p>
  </div>
  <form class="auth-panel space-y-4" method="post" th:action="@{/admin/login}">
    <div th:if="${param.error}" class="alert alert-error !mb-0" role="alert">Sai tên đăng nhập hoặc mật khẩu.</div>
    <div th:if="${param.logout}" class="alert alert-success !mb-0" role="status">Bạn đã đăng xuất.</div>
    <div>
      <label class="label" for="username">Tài khoản quản trị</label>
      <input class="input-field" id="username" name="username" autocomplete="username" autofocus="autofocus" required="required"/>
    </div>
    <div>
      <label class="label" for="password">Mật khẩu</label>
      <input class="input-field" id="password" name="password" type="password" autocomplete="current-password" required="required"/>
    </div>
    <button class="btn-primary w-full" type="submit">Đăng nhập</button>
    <p class="text-center text-xs leading-5 text-slate-500">Mọi lần đăng nhập vào khu vực này đều được ghi nhận.</p>
  </form>
  <p class="mt-5 text-center text-sm text-slate-500">
    <a data-path="/staff/login" data-port="8081" th:href="@{/staff/login}" class="font-medium hover:text-brand-700">Đăng nhập nhân viên</a>
    <span class="px-1 text-slate-300">·</span><a th:href="@{/shop}" class="font-medium hover:text-brand-700">Về cửa hàng</a>
  </p>
</div>
</main>
<script th:src="@{/js/app.js}" defer="defer"></script>
</body>
</html>
