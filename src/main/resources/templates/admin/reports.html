<html th:replace="~{layout/staff :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Báo cáo – Lapstore Admin</title></head>
<body><section class="space-y-6">
<div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Báo cáo doanh thu</h1><p class="page-sub">Tổng hợp theo ngày và chi nhánh.</p></div></div>
  <form th:action="@{/admin/reports}" method="get" class="card flex flex-wrap items-end gap-3">
    <div><label class="label" for="from">Từ ngày</label><input class="input-field" id="from" name="from" type="date" th:value="${from}"/></div>
    <div><label class="label" for="to">Đến ngày</label><input class="input-field" id="to" name="to" type="date" th:value="${to}"/></div>
    <div><label class="label" for="branchId">Chi nhánh</label><select class="input-field w-48" id="branchId" name="branchId"><option value="">Tất cả</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}">CN</option></select></div>
    <button class="btn-primary" type="submit">Xem báo cáo</button></form>
  <th:block th:if="${rows.isEmpty()}"><div th:replace="~{fragments/ui :: empty('Chưa có dữ liệu')}"></div></th:block>
  <div th:unless="${rows.isEmpty()}" class="space-y-4">
    <div class="grid gap-4 sm:grid-cols-3">
      <div class="card"><p class="text-xs text-slate-500">Tổng đơn</p><p class="text-2xl font-extrabold" th:text="${totalOrders}">0</p></div>
      <div class="card"><p class="text-xs text-slate-500">Doanh thu</p><p class="text-2xl font-extrabold text-brand-700"><span th:replace="~{fragments/ui :: money(${totalRevenue})}"></span></p></div>
      <div class="card"><p class="text-xs text-slate-500">Lãi ước tính</p><p class="text-2xl font-extrabold text-emerald-600"><span th:replace="~{fragments/ui :: money(${totalProfit})}"></span></p></div></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Chi nhánh</th><th class="text-right">Số đơn</th><th class="text-right">Doanh thu</th><th class="text-right">Lãi ước tính</th></tr></thead>
      <tbody><tr th:each="r : ${rows}"><td th:text="${r.date}">05/11</td><td th:text="${r.branch}">CN</td><td class="text-right" th:text="${r.orders}">0</td>
        <td class="text-right"><span th:replace="~{fragments/ui :: money(${r.revenue})}"></span></td><td class="text-right"><span th:replace="~{fragments/ui :: money(${r.profit})}"></span></td></tr></tbody></table></div></div>
</section></body></html>
